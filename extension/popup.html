<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width: 340px; min-height: 400px; background: #0a0e1a; color: #e2e8f0; font-family: 'Inter', sans-serif; font-size: 13px; }

  header { background: #111827; padding: 14px 16px; border-bottom: 1px solid #1e2d45; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 14px; font-weight: 700; background: linear-gradient(135deg, #3b82f6, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .dot { width:7px; height:7px; border-radius:50%; background:#10b981; box-shadow:0 0 6px #10b981; }
  .dot.off { background:#ef4444; box-shadow:0 0 6px #ef4444; }

  .section { padding: 12px 14px; border-bottom: 1px solid #1e2d45; }
  .label { font-size:10px; color:#64748b; text-transform:uppercase; letter-spacing:.07em; margin-bottom:6px; font-weight:600; }

  .stat-row { display:flex; gap:8px; }
  .stat { flex:1; background:#111827; border-radius:8px; padding:10px; text-align:center; border:1px solid #1e2d45; }
  .stat-val { font-size:20px; font-weight:700; color:#3b82f6; }
  .stat-lbl { font-size:10px; color:#64748b; margin-top:2px; }

  input, select { width:100%; background:#1a2235; border:1px solid #1e2d45; color:#e2e8f0; padding:7px 10px; border-radius:7px; font-size:12px; font-family:inherit; margin-bottom:6px; outline:none; }
  input:focus, select:focus { border-color:#3b82f6; }

  .btn-row { display:flex; gap:6px; }
  button { flex:1; padding:8px; border:none; border-radius:7px; font-size:12px; font-weight:600; font-family:inherit; cursor:pointer; transition:all .15s; }
  .btn-green { background:#10b981; color:#fff; }
  .btn-red { background:#ef4444; color:#fff; }
  .btn-blue { background:#3b82f6; color:#fff; }
  button:hover { opacity:.85; transform:translateY(-1px); }

  .approval { background:rgba(245,158,11,.1); border:1px solid #f59e0b; border-radius:8px; padding:10px; margin-bottom:6px; }
  .approval-title { font-weight:600; color:#f59e0b; margin-bottom:4px; }
  .approval-sub { color:#94a3b8; font-size:11px; margin-bottom:8px; }
  .approval-btns { display:flex; gap:6px; }
  .approval-btns button { padding:5px; font-size:11px; }

  #vps-url { font-size:11px; }
  .link { color:#3b82f6; cursor:pointer; text-decoration:underline; font-size:11px; }

  .empty { color:#64748b; font-size:12px; text-align:center; padding:8px; }
</style>
</head>
<body>

<header>
  <h1>⚡ Trading Bot</h1>
  <div style="display:flex;align-items:center;gap:8px">
    <span id="ws-status" style="font-size:11px;color:#64748b">Disconnected</span>
    <div class="dot off" id="ws-dot"></div>
  </div>
</header>

<!-- VPS Config -->
<div class="section">
  <div class="label">VPS Server</div>
  <input id="vps-url" placeholder="http://43.153.213.254:3000" value="">
  <div class="btn-row">
    <button class="btn-blue" onclick="connectVPS()">🔗 Connect</button>
    <a class="link" id="dashboard-link" style="display:flex;align-items:center;padding:0 6px" href="#" target="_blank">🌐 Dashboard</a>
  </div>
</div>

<!-- Stats -->
<div class="section">
  <div class="label">Status</div>
  <div class="stat-row">
    <div class="stat"><div class="stat-val" id="stat-bots">0</div><div class="stat-lbl">Bot Aktif</div></div>
    <div class="stat"><div class="stat-val" id="stat-approvals" style="color:#f59e0b">0</div><div class="stat-lbl">Pending</div></div>
  </div>
</div>

<!-- Quick control -->
<div class="section">
  <div class="label">Quick Start Bot</div>
  <input id="q-pair" placeholder="Pair (btcidr, ethinr...)" value="btcidr">
  <select id="q-mode">
    <option value="auto">Full Auto</option>
    <option value="semi">Semi Auto</option>
  </select>
  <div class="btn-row">
    <button class="btn-green" onclick="quickStart()">▶ Start</button>
    <button class="btn-red" onclick="quickStop()">⏹ Stop</button>
  </div>
</div>

<!-- Pending approvals -->
<div class="section">
  <div class="label">🔔 Pending Approval</div>
  <div id="approvals-list"><div class="empty">Tidak ada pending</div></div>
</div>

<!-- Recent price -->
<div class="section">
  <div class="label">Harga Terakhir</div>
  <div id="price-display" class="empty">Hubungkan ke VPS dulu</div>
</div>

<script src="popup.js"></script>
</body>
</html>
