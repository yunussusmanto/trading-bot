<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – Trading Bot Pro v4.0.7</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; background:#121214;
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif;
  }
  /* Animated bg */
  body::before {
    content:''; position:fixed; inset:0;
    background: radial-gradient(ellipse at 20% 50%, rgba(100,100,100,.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(150,150,150,.1) 0%, transparent 60%);
    pointer-events:none;
  }

  .card {
    background: rgba(26,26,28,.95);
    border: 1px solid #2a2a2c;
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%; max-width: 400px;
    backdrop-filter: blur(20px);
    box-shadow: 0 25px 50px rgba(0,0,0,.6);
    animation: slideUp .4s ease;
  }
  @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

  .logo {
    text-align:center; margin-bottom:28px;
  }
  .logo-icon {
    width:56px; height:56px; border-radius:14px; margin:0 auto 12px;
    background: linear-gradient(135deg,#4b5563,#9ca3af);
    display:flex; align-items:center; justify-content:center;
    font-size:24px;
  }
  .logo h1 { font-size:20px; font-weight:700; color:#F8FAFC; }
  .logo p { font-size:13px; color:#94A3B8; margin-top:4px; }

  .form-group { margin-bottom:16px; }
  label { display:block; font-size:12px; font-weight:500; color:#94A3B8; margin-bottom:6px; }
  input {
    width:100%; padding:11px 14px;
    background:#242426; border:1px solid #2a2a2c; border-radius:10px;
    color:#F8FAFC; font-size:14px; font-family:inherit;
    outline:none; transition:border-color .2s, box-shadow .2s;
  }
  input:focus { border-color:#6b7280; box-shadow:0 0 0 3px rgba(107,114,128,.2); }

  .btn {
    width:100%; padding:12px;
    background: linear-gradient(135deg,#4b5563,#9ca3af);
    color:#fff; border:none; border-radius:10px;
    font-size:14px; font-weight:600; font-family:inherit;
    cursor:pointer; margin-top:8px;
    transition:opacity .2s, transform .1s;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:hover { opacity:.9; transform:translateY(-1px); }
  .btn:active { transform:translateY(0); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }

  .error {
    background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3);
    color:#ef4444; padding:10px 14px; border-radius:8px;
    font-size:13px; margin-top:12px; display:none;
  }
  .footer { text-align:center; margin-top:24px; font-size:12px; color:#475569; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <h1>Trading Bot Pro v4.0.7</h1>
    <p>Indodax Auto Trader Dashboard</p>
  </div>

  <form id="form">
    <div class="form-group">
      <label>Username</label>
      <input id="username" type="text" placeholder="admin" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••••••" autocomplete="current-password" required>
    </div>
    <button class="btn" id="btn" type="submit">→ Masuk</button>
    <div class="error" id="error"></div>
  </form>

  <div class="footer">Trading Bot Pro v4.0.7 © 2026 · Indodax</div>
</div>

<script>
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('error');
  btn.disabled = true; btn.textContent = 'Memverifikasi...';
  err.style.display = 'none';

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
    }),
  });
  const data = await res.json();

  if (data.ok) {
    window.location.href = '/';
  } else {
    err.textContent = data.error || 'Login gagal';
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = '→ Masuk';
  }
});
</script>
</body>
</html>
